<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Contact Us</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css" />
        <link rel="stylesheet" href="Resources/custom.css" />
    </head>

    <body class="bg-soft-primary">
        <div class="container shadow-lg mt-5">
            <div class="row litBoxBig">
                <div class="col-md-10 bg-pink p-5">
                    <div class="">
                        <div class="p-5"></div>
                        <h2 class="fs-2x text-center text-light">Contact Me</h2>
                        <span class="ps-5"
                            >Feel free to contact me anytime. I will get back to you as soon as I can!</span
                        >
                        <div class="p-2"></div>
                        <form action="#" class="ms-5 w-50">
                            <div class="form-group">
                                <label for="name" class=""><i class="bi bi-person-fill me-3"></i>Name</label>
                                <input
                                    type="text"
                                    class="form-control mb-3 bg-pink border border-0 border-bottom border-2 border-dark rounded-0"
                                    placeholder="Enter your name" />
                            </div>
                            <div class="form-group">
                                <label for="name" class=""><i class="bi bi-envelope me-3"></i>Email</label>
                                <input
                                    type="email"
                                    class="form-control mb-3 bg-pink border border-0 border-bottom border-2 border-dark rounded-0"
                                    placeholder="Please use Direct email instead" />
                                <div class="d-flex">
                                    <a
                                        href="mailto:monajelevated@gmail.com"
                                        id="directEmail"
                                        class="ms-auto text-decoration-none"
                                        >Direct Email</a
                                    >
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="Message" class=""><i class="bi bi-blockquote-right me-3"></i>Message</label>
                                <input
                                    class="form-control mb-3 bg-pink border border-0 border-bottom border-2 border-dark rounded-0"
                                    placeholder="Enter Message" />
                            </div>
                            <button class="btn bg-light text-center fw-bold w-100 mt-5">Send</button>
                            <div class="pb-5"></div>
                        </form>
                    </div>
                </div>
                <div class="col-md-2 bg-white-50 p-2 b-stuff-col">
                    <div class="">
                        <div class="b-stuff">
                            <i class="bi bi-facebook me-3"></i>
                            <i class="bi bi-instagram me-3"></i>
                            <i class="bi bi-twitter"></i>
                        </div>
                    </div>
                </div>
                <div class="card bg-dark p-5 litBox rounded-0">
                    <div class="card-title text-white p-2">Info</div>
                    <div class="card-body text-white p-2">
                        <p>
                            <small><i class="bi bi-envelope me-2"></i>monajelevated@gmail.com</small>
                        </p>
                        <p>
                            <small><i class="bi bi-telephone me-2"></i>+2349035513690</small>
                        </p>
                        <p>
                            <small><i class="bi bi-building me-2"></i>Abuja</small>
                        </p>
                        <p>
                            <small><i class="bi bi-clock me-2"></i>07:00 - 24:00</small>
                        </p>
                    </div>
                </div>
            </div>
        </div>

       
    </body>
</html>
